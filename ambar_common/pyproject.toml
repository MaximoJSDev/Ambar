[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambar-common"
version = "0.1.0"
description = "Shared validation rules for the Ambar SIGE client and server"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["ambar_common"]
package-dir = { ambar_common = "." }
